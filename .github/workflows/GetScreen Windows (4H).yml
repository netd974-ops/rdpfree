name: Windows RDP Free (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Native Connection
        shell: powershell
        run: |
          # 1. Setup Remote Desktop and administrative credentials
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # 2. Install Cloudflared using Microsoft's official Winget tool
          Write-Host "Installing Cloudflared via Winget Package Manager..."
          winget install --id Cloudflare.cloudflared --exact --accept-package-agreements --accept-source-agreements --silent
          
          # 3. Start the live connection tunnel and generate the link
          Write-Host "Starting Secure RDP Tunnel... Please look for .trycloudflare.com link below:"
          cloudflared tunnel --url rdp://localhost:3389











