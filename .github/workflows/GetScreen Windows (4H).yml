name: Windows RDP Free Ultimate (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Native Tmate Tunnel
        shell: powershell
        run: |
          # 1. إعداد نظام التحكم عن بعد وكلمة المرور وتخطي الحمايات
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # 2. تشغيل الأداة الرسمية المدمجة لإنشاء نفق بث خارق
          Write-Host "Launching Native Connection... Please wait 30 seconds for the links."
          choco install tmate --no-progress -y
          tmate -F
