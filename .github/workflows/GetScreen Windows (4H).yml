name: Windows RDP Free (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Remote.it Tunnel
        shell: powershell
        run: |
          # 1. إعداد نظام التحكم عن بعد وكلمة المرور في الويندوز
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # 2. تفعيل التشفير وتحميل النسخة المحمولة المباشرة للأداة الرسمية لتفادي أخطاء المسارات
          Write-Host "Downloading Remote.it Portable CLI..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          $url = "https://remote.it"
          Invoke-WebRequest -Uri $url -OutFile "remoteit.zip"
          
          # 3. فك الضغط عن الأداة في مجلد التشغيل الحالي
          Expand-Archive -Path "remoteit.zip" -DestinationPath ".\" -Force
          
          # 4. ربط وتفعيل السيرفر بحسابك الشخصي ومشاركة منفذ الـ RDP تلقائياً
          Write-Host "Connecting Server to your Remote.it Account..."
          .\remoteit.exe register "TJBXSV2UM3PS"
          .\remoteit.exe add --port 3389 --protocol tcp --name "Cloud-RDP"
          
          # 5. إبقاء الخادم حياً ومستقراً لـ 4 ساعات كاملة
          python -c "import time; print('RDP Tunnel is live!'); time.sleep(14400)"







