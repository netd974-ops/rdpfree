name: Windows RDP (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Setting Up RDP Connection
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # تحميل وتثبيت أداة Ngrok الرسمية الآمنة
          Invoke-WebRequest -Uri "https://equinox.io" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "."
          
          # تفعيل الاتصال المشفر
          .\ngrok.exe config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"

      - name: Keep Alive Counter
        shell: cmd
        run: |
          python -c "import time; print('RDP is running successfully...'); time.sleep(14400)"


