name: Windows RDP Free (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Native Connection
        shell: powershell
        run: |
          # 1. إعداد نظام التحكم عن بعد وكلمة المرور في الويندوز
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # 2. تحميل الأداة الرسمية الصحيحة بنسبة 100% باستخدام Curl الذكي لتفادي تلف الملفات
          Write-Host "Downloading Official Cloudflared Agent..."
          curl.exe -L "https://github.com" -o "cloudflared.exe"
          
          # 3. بث النفق السحابي المباشر والانتظار لتوليد الرابط فوراً
          Write-Host "Starting Secure RDP Tunnel... Please look for .trycloudflare.com link below:"
          .\cloudflared.exe tunnel --url rdp://localhost:3389










