name: GetScreen Windows (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Downloading & Setting Up
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          curl.exe -L "https://getscreen.me" -o "getscreen.exe"
          Start-Process -FilePath ".\getscreen.exe" -ArgumentList "-register jordanegaylord8@gmail.com" -Wait
          Start-Process -FilePath ".\getscreen.exe" -ArgumentList "-install" -Wait

      - name: Time Counter
        shell: cmd
        run: |
          python -c "import time; time.sleep(14400)"


