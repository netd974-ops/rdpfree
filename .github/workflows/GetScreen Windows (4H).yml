name: Windows RDP (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Setting Up RDP Connection
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          choco install ngrok --no-progress -y
          ngrok config add-authtoken "3HuHuPv5ozuC0uUZnWfWQGYZoLY_2zouEvHxwFjewJaaTjk65"
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389"

      - name: Keep Alive Counter
        shell: cmd
        run: |
          python -c "import time; print('RDP is running successfully...'); time.sleep(14400)"


