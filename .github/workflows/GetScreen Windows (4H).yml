name: GetScreen Windows (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Downloading & Setting Up
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = "https://getscreen.me"
          Start-BitsTransfer -Source $url -Destination ".\getscreen.exe"
          Start-Process -FilePath ".\getscreen.exe" -ArgumentList "/S /email:jordanegaylord8@gmail.com" -Wait

      - name: Time Counter
        shell: cmd
        run: |
          python -c "import time; time.sleep(14400)"



