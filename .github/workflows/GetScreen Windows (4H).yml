name: Windows RDP (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP & Ngrok Connection
        shell: powershell
        run: |
          # إعداد نظام التحكم عن بعد وكلمة المرور
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # تثبيت تانيل نجيروك وتوثيق الحساب
          choco install ngrok --no-progress -y
          ngrok config add-authtoken "3HuMmTxzQdMYNWUKVg0dWRscq3m_63j8PqT8boCohnRJwgnTt"
          
          # تشغيل الاتصال بشكل مباشر ومستمر لإجبار السيرفر على البقاء حياً
          Write-Host "Starting RDP Tunnel... Please check your Endpoints dashboard."
          ngrok tcp 3389

