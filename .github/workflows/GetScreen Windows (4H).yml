name: Windows RDP Free (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Remote.it Tunnel
        shell: powershell
        run: |
          # 1. إعداد نظام التحكم عن بعد وكلمة المرور في الويندوز
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # 2. تشغيل السكربت الرسمي لشركة Remote.it لتثبيت الأداة وحقن مفتاحك الشخصي تلقائياً
          Write-Host "Installing and Connecting Server to Remote.it..."
          $env:adddevice_key = "TJBXSV2UM3PS"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          iex (New-Object Net.WebClient).DownloadString('https://remote.it')
          
          # 3. إبقاء الخادم حياً ومستقراً لـ 4 ساعات
          python -c "import time; print('RDP Tunnel is live!'); time.sleep(14400)"




