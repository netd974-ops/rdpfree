name: Windows RDP Free (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Remote.it Tunnel
        shell: powershell
        run: |
          # 1. إعداد نظام التحكم عن بعد وكلمة المرور في الويندوز
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # 2. تشغيل التثبيت والربط الصامت الفوري المعتمد من الشركة بمفتاحك الشخصي
          Write-Host "Installing and Connecting Server to your Remote.it Account..."
          icacls.exe "C:\Windows\System32" /grant "runneradmin:(OI)(CI)F" /T /Q
          $connect_script = "TJBXSV2UM3PS"
          Set-ExecutionPolicy Bypass -Scope Process -Force; Imp (New-Object System.Net.WebClient).DownloadString('https://remote.it')
          
          # 3. إبقاء الخادم حياً ومستقراً لـ 4 ساعات
          python -c "import time; print('RDP Tunnel is live!'); time.sleep(14400)"



