name: Windows RDP Free (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Zero-Install SSH
        shell: powershell
        run: |
          # إعداد نظام التحكم عن بعد وكلمة المرور في الويندوز
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # فتح النفق باستخدام الـ IP المباشر لتفادي أخطاء الـ DNS والحظر
          Write-Host "Starting Secure SSH RDP Tunnel via Direct IP..."
          ssh.exe -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -p 223 -R 0:127.0.0.1:3389 HbNDJfOd7X86uThBeEF34q2ZRAjnwgWi5@164.92.228.188
