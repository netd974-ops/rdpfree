name: Windows RDP Free (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Native Connection
        shell: powershell
        run: |
          # 1. إعداد نظام التحكم عن بعد وكلمة المرور وتجاوز الحماية
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # 2. تثبيت أداة Localtonet الرسمية المستقرة عبر مدير حزم مايكروسوفت لضمان الحجم الكامل
          Write-Host "Installing Localtonet client..."
          winget install --id Localtonet.Localtonet --exact --accept-package-agreements --accept-source-agreements --silent
          
          # 3. بث النفق السحابي المباشر والربط التلقائي بحسابك
          Write-Host "Starting Free RDP Tunnel via Localtonet..."
          & "C:\Program Files\Localtonet\localtonet.exe" -authtoken "HbNDJfOd7X86uThBeEF34q2ZRAjnwgWi5" -protocol tcp -port 3389











