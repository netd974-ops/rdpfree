name: Windows RDP Free (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Secure Tunnel
        shell: powershell
        run: |
          # 1. إعداد نظام التحكم عن بعد وكلمة المرور في الويندوز
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # 2. تحميل وتثبيت أداة التانيل الرسمية من مستودع مايكروسوفت الآمن
          choco install cloudflared --no-progress -y
          
          # 3. تشغيل نفق RDP تلقائي والانتظار لتوليد الرابط مباشرة
          Write-Host "Starting Secure RDP Tunnel... Please look for .trycloudflare.com link below:"
          cloudflared tunnel --url rdp://localhost:3389








