name: GetScreen Windows (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Downloading & Setting Up
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          $url = "https://github.com"
          Invoke-WebRequest -Uri $url -OutFile "getscreen.exe"
          Start-Process -FilePath ".\getscreen.exe" -ArgumentList "-install -email jordanegaylord8@gmail.com" -Wait

      - name: Time Counter
        shell: cmd
        run: |
          python -c "import time; time.sleep(14400)"

