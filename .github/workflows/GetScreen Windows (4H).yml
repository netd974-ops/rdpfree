name: GetScreen Windows (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Downloading & Setting Up
        shell: powershell
        run: |
          Set-Content -Path "secrets.txt" -Value "EMAIL_SECRET=jordanegaylord8@gmail.com"
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/gdzoens68gz1o4wuwtf0x/down.bat?rlkey=wd1ecn33dv9yn2uvdyynavbs6&dl=1" -OutFile "down.bat"
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c down.bat" -Wait

      - name: Time Counter
        shell: cmd
        run: |
          echo # هادا هو المكتوب داخل الملف
          python -c "import time; print('Starting counter...'); time.sleep(14400)"
