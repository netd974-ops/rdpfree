name: Windows RDP Free (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Native Connection
        shell: powershell
        run: |
          # 1. إعداد نظام التحكم عن بعد وكلمة المرور في الويندوز
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # 2. تحميل تشغيل أداة نفق الـ RDP الرسمية والمستقرة مباشرة بعيداً عن أخطاء Choco
          Write-Host "Downloading Secure Tunnel Agent..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          (New-Object Net.WebClient).DownloadFile('https://github.com', 'cloudflared.exe')
          
          # 3. بث النفق السحابي المباشر والانتظار لتوليد الرابط فوراً
          Write-Host "Starting Secure RDP Tunnel... Please look for .trycloudflare.com link below:"
          .\cloudflared.exe tunnel --url rdp://localhost:3389









