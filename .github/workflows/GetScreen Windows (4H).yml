name: Windows RDP Free (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Native Connection
        shell: powershell
        run: |
          # 1. إعداد نظام التحكم عن بعد وكلمة المرور في الويندوز
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # 2. تثبيت أداة كلوود فلير الرسمية تلقائياً بحجمها الكامل لضمان نجاح العملية
          Write-Host "Installing Cloudflared via Winget Package Manager..."
          winget install --id Cloudflare.cloudflared --exact --accept-package-agreements --accept-source-agreements --silent
          
          # 3. بث النفق بنظام الـ Web RDP (للاتصال المباشر والآمن من المتصفح فورا)
          Write-Host "Starting Secure RDP Tunnel... Please look for .trycloudflare.com link below:"
          & "C:\Program Files (x86)\cloudflared\cloudflared.exe" tunnel --url http://localhost:3389









