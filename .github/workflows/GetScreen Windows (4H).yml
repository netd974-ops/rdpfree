name: Windows RDP Free (4H)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Launching RDP via Native Connection
        shell: powershell
        run: |
          # 1. Setup Remote Desktop and administrative credentials
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "Password123!"
          
          # 2. Download the official cloudflared binary directly into workspace
          Write-Host "Downloading cloudflared binary..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          Invoke-WebRequest -Uri "https://github.com" -OutFile ".\cloudflared.exe"
          
          # 3. Start the live connection tunnel and generate the link
          Write-Host "Starting Secure Cloudflare RDP Tunnel..."
          .\cloudflared.exe tunnel --url rdp://localhost:3389





